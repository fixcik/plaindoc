name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A failed OCR model download must fail the build, not give a model-less one.
  PLAINDOC_REQUIRE_MODELS: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
      # ONNX Runtime (ort-sys) is unpacked outside target/ and the cached build script links
      # from there, so it must live in the same cache entry as target/. OCR models are re-fetched
      # by build.rs when missing; macOS keeps them under a path with a space, not cached.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/.local/share/plaindoc/models
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: scripts/check-file-size.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/ort.pyke.io
            ~/.local/share/plaindoc/models
            ~/AppData/Local/plaindoc/models
      - run: cargo test --workspace --all-features --locked --no-fail-fast
